<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worksheet Studio</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.4/dist/svg2pdf.umd.min.js" integrity="sha384-HoxAKaOOcVifYbcey45SDVl9ja1q3b04qwykef9f6tzQAkkmNNGH3lclNdTquUX9" crossorigin="anonymous"></script>
<style>body{margin:0;background:#f1f5f9;font-family:system-ui,sans-serif}#ws-boot{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;color:#64748b;font-size:15px;text-align:center}</style>
</head>
<body>
<div id="ws-boot">Memuat Worksheet Studio…</div>
<script>
// Shell tipis Gemini Canvas: tempel SEKALI. Aplikasi dimuat dari jsDelivr (arulbarker/cdn-worksheet-studio@main).
const apiKey = ""; // dibiarkan kosong, Canvas mengisi kunci Gemini otomatis
window.__wsApiKey = apiKey;
(function () {
  var s = document.createElement('script');
  s.src = "https://cdn.jsdelivr.net/gh/arulbarker/cdn-worksheet-studio@main/worksheet-studio.js";
  s.onerror = function () {
    var b = document.getElementById('ws-boot');
    if (b) b.textContent = 'Gagal memuat aplikasi. Periksa koneksi internet, lalu muat ulang halaman.';
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
