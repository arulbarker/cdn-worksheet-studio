<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worksheet Studio</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.4/dist/svg2pdf.umd.min.js" integrity="sha384-HoxAKaOOcVifYbcey45SDVl9ja1q3b04qwykef9f6tzQAkkmNNGH3lclNdTquUX9" crossorigin="anonymous"></script>
<style>body{margin:0;background:#f1f5f9;font-family:system-ui,sans-serif}#ws-boot{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;color:#64748b;font-size:15px;text-align:center}</style>
</head>
<body>
<div id="ws-boot">Memuat Worksheet Studio…</div>
<script>
// Shell tipis Gemini Canvas: tempel SEKALI. Bootstrap self-resolving (anti stale-cache):
// SHA commit terbaru via GitHub API -> bundle dari URL commit-pinned (immutable, kebal cache
// browser 7 hari milik @main); fallback @main cdn -> fastly. Semua fetch cache:"no-cache".
const apiKey = ""; // dibiarkan kosong, Canvas mengisi kunci Gemini otomatis
window.__wsApiKey = apiKey;
(function () {
  var REPO = "arulbarker/cdn-worksheet-studio", FILE = "worksheet-studio.js";
  async function daftarBase() {
    var out = [];
    try {
      var r = await fetch('https://api.github.com/repos/' + REPO + '/commits/main', { cache: 'no-store' });
      if (r.ok) { var j = await r.json(); if (j && j.sha) out.push('https://cdn.jsdelivr.net/gh/' + REPO + '@' + j.sha); }
    } catch (e) { console.warn('[shell] SHA dilewati:', e); }
    return out.concat(['https://cdn.jsdelivr.net/gh/' + REPO + '@main', 'https://fastly.jsdelivr.net/gh/' + REPO + '@main']);
  }
  (async function () {
    var list = await daftarBase();
    for (var i = 0; i < list.length; i++) {
      try {
        var res = await fetch(list[i] + '/' + FILE, { cache: 'no-cache' });
        if (!res.ok) continue;
        var kode = await res.text();
        var blob = URL.createObjectURL(new Blob([kode], { type: 'text/javascript' }));
        await new Promise(function (ok, no) {
          var s = document.createElement('script');
          s.src = blob; s.onload = ok; s.onerror = no;
          document.body.appendChild(s);
        });
        console.log('[shell] bundle dari', list[i]);
        return;
      } catch (e) { console.warn('[shell] base gagal:', list[i], e); }
    }
    var b = document.getElementById('ws-boot');
    if (b) b.textContent = 'Gagal memuat aplikasi. Periksa koneksi internet, lalu muat ulang halaman.';
  })();
})();
</script>
</body>
</html>
